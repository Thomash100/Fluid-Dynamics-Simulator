name: CI-CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate version file
        run: |
          test -f version.json
          cat version.json

      - name: Create artifact
        run: |
          mkdir -p artifact/project
          git archive --format=tar HEAD | tar -x -C artifact/project

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: artifact

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          git archive --format=zip --output=release.zip HEAD

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          overwrite_files: true
          files: release.zip

  deploy-rpi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    env:
      RPI_HOST: ${{ secrets.RPI_HOST }}
      RPI_USER: ${{ secrets.RPI_USER }}
      RPI_SSH_KEY: ${{ secrets.RPI_SSH_KEY }}

    steps:
      - name: Check deployment configuration
        if: env.RPI_HOST == '' || env.RPI_USER == '' || env.RPI_SSH_KEY == ''
        run: echo "Raspberry Pi deployment secrets are not configured; skipping deployment."

      - name: Deploy to Raspberry Pi
        if: env.RPI_HOST != '' && env.RPI_USER != '' && env.RPI_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.RPI_HOST }}
          username: ${{ env.RPI_USER }}
          key: ${{ env.RPI_SSH_KEY }}
          script: |
            cd /opt/fluid-dynamics-simulator
            git pull
            docker compose up -d --build
